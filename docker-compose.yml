services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diftel}
      POSTGRES_USER: ${POSTGRES_USER:-diftel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diftel}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  web-django:
    build: ./django_app
    restart: unless-stopped
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn dashboard_interna.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./django_app/dashboard-interna/media:/app/media
      - ./django_app/static:/app/staticfiles
      - ./data/recursos:/data/recursos
      - ./data/buzon:/data/buzon
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./django_app/static:/static:ro
      - ./django_app/dashboard-interna/media:/media:ro
      - ./data/recursos:/data/recursos:ro
      - ./data/landing:/usr/share/nginx/html:ro
    depends_on:
      - web-django
