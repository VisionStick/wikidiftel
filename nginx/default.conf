upstream django_upstream {
    server web-django:8000;
}

server {
    listen 80;
    server_name telematica.josnic.cl;
    client_max_body_size 2G;

    location = / {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recursos/ {
        alias /var/www/recursos/;
        autoindex on;
        add_header Content-Security-Policy "frame-ancestors 'self' https://wiki-diftel.josnic.cl;" always;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        send_timeout 300s;
        add_header Accept-Ranges bytes;
    }

    location /buzon/ {
        alias /var/www/landing/buzon/;
        index index.html;
        try_files $uri $uri/ /buzon/index.html;
    }

    location ~ ^/(buzon/api|admin|talleres|comunidad|proyectos-iniciales|proyectos|malla|buscar) {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ { alias /var/www/django_static/; }
    location /media/ { alias /var/www/django_media/; }
}
