name: Restaurar GitHub Pages desde ZIP base

on:
  push:
    branches: [main]
    paths:
      - '.pages-restore/**'
      - '.github/workflows/restore-pages-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir export estático desde fragmentos verificados
        shell: bash
        run: |
          set -euo pipefail
          test -d .pages-restore
          cat .pages-restore/chunk-*.b64 > /tmp/static_export_exact.tar.xz.b64
          base64 -d /tmp/static_export_exact.tar.xz.b64 > /tmp/static_export_exact.tar.xz
          echo '27401c4fc830a68c53b572ab5ab47aa2e56e70b1da66fea61189d496f0047f1b  /tmp/static_export_exact.tar.xz' | sha256sum -c -
          tar -xJf /tmp/static_export_exact.tar.xz -C .

      - name: Limpiar restos de versiones anteriores
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-restore
          rm -f root.css style.css

      - name: Confirmar restauración del ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/landing.css
          test -f assets/site.js
          test -f assets/buzon.js
          test -f malla/index.html
          test -f proyectos/index.html
          test -f proyectos-iniciales/index.html
          test -f talleres/index.html
          test -f comunidad/index.html
          test -f buscar/index.html
          test -f buzon/index.html
          grep -q 'Todo lo que hace grande a' index.html
          grep -q 'Malla y Ramos' malla/index.html
          grep -q 'Proyectos realizados por DIFTEL' proyectos/index.html

      - name: Commit de archivos Pages restaurados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios para commitear.'
          else
            git commit -m 'Restaura Pages desde ZIP base DIFTEL'
            git push
          fi
