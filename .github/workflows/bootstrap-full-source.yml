name: Completar Wiki DIFTEL

on:
  push:
    paths:
      - '.github/workflows/bootstrap-full-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir y validar código fuente
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/full-00.b64 \
            .bootstrap/full-01.b64 \
            .bootstrap/full-02.b64 \
            .bootstrap/full-03.b64 \
            .bootstrap/full-04.b64 \
            .bootstrap/full-05.b64 \
            .bootstrap/full-06.b64 \
            .bootstrap/full-07.b64 \
            .bootstrap/full-08.b64 \
            .bootstrap/full-09.b64 \
            .bootstrap/full-10.b64 \
            .bootstrap/full-11.b64 \
            .bootstrap/full-12a.b64 \
            .bootstrap/full-12b.b64 \
            .bootstrap/full-13.b64 \
            | base64 -d > /tmp/wikidiftel-source.tar.xz

          xz -t /tmp/wikidiftel-source.tar.xz
          tar -xJf /tmp/wikidiftel-source.tar.xz -C .

          test -f django_app/dashboard-interna/dashboard/models.py
          test -f django_app/dashboard-interna/dashboard/views.py
          test -f django_app/dashboard-interna/dashboard/migrations/0009_seed_curriculum.py
          test -f django_app/dashboard-interna/dashboard/templates/dashboard/course_detail.html
          test -f django_app/dashboard-interna/dashboard/static/css/landing.css
          test -f docker-compose.yml

          rm -rf .bootstrap

      - name: Guardar versión completa en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "Completa Wiki DIFTEL desde la versión revisada"
          git push origin HEAD:main
